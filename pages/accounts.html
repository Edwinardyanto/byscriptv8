<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accounts | Trading Dashboard</title>
    <link rel="stylesheet" href="../src/styles/color-tokens.css">
    <link rel="stylesheet" href="../src/styles/main.css">
    <style>
      body.page-accounts {
        background: radial-gradient(circle at top, #101319 0%, #0c0f14 50%, #080b10 100%);
      }

      .page-accounts .section--header .section-header {
        justify-content: center;
      }

      .page-accounts .accounts-header {
        padding: 0 18px;
      }

      .page-accounts .accounts-header .section-header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        width: 100%;
      }

      .page-accounts .accounts-header .section-title {
        margin: 0;
        text-align: center;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .page-accounts .accounts-header-spacer {
        height: 32px;
      }

      .page-accounts .accounts-main {
        gap: 12px;
      }

      .page-accounts .accounts-content {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
      }

      .page-accounts .accounts-summary {
        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .page-accounts .accounts-summary-grid {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        gap: 12px;
        align-items: stretch;
        min-height: 0;
      }

      .page-accounts .accounts-panel {
        background: linear-gradient(145deg, rgba(18, 20, 24, 0.92), rgba(14, 16, 20, 0.78));
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-lg);
        padding: 18px;
        box-shadow: 0 24px 40px var(--color-shadow-deep), inset 0 1px 0 var(--color-overlay-xs-strong);
        backdrop-filter: blur(16px);
        min-height: 0;
      }

      .page-accounts .accounts-section-title,
      .page-accounts .accounts-distribution-title {
        font-size: 0.62rem;
        text-transform: uppercase;
        letter-spacing: 0.28em;
        color: var(--color-muted);
      }

      .page-accounts .accounts-summary-left {
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100%;
        min-height: 0;
      }

      .page-accounts .accounts-summary-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
        min-height: 0;
      }

      .page-accounts .accounts-summary-panel [data-total-performance="accounts"] {
        flex: 1;
        min-height: 0;
      }

      .page-accounts .accounts-summary-panel .card--summary {
        gap: 16px;
      }

      .page-accounts .accounts-summary-panel .stat-value {
        font-size: 2.3rem;
        font-weight: 600;
      }

      .page-accounts .accounts-summary-panel .asset-summary-header {
        align-items: flex-start;
      }

      /* Match Dashboard: value + PnL pill inline */
      .page-accounts .accounts-summary-panel .asset-summary-metric h1 {
        display: flex;
        align-items: center;
        gap: 0;
        margin: 0;
        line-height: 1;
        font-size: 2.3rem;
        font-weight: 600;
        color: var(--color-text);
      }

      .page-accounts .accounts-summary-panel .asset-summary-metric h1 .badge {
        padding: 4px 10px;
        font-size: 12px;
        border-radius: 999px;
      }

      .page-accounts .accounts-summary-panel .timeframe-pills {
        margin-left: auto;
      }

      .page-accounts .accounts-summary-panel .badge {
        display: inline-flex;
      }

      .page-accounts .accounts-summary-panel .stat-status-dot {
        display: inline-flex;
      }

      .page-accounts .accounts-distribution {
        display: flex;
        flex-direction: column;
        gap: 16px;
        height: 100%;
        min-height: 0;
      }

      .page-accounts .accounts-distribution-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .page-accounts .accounts-distribution-filter {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.7rem;
        color: var(--color-text-secondary);
      }

      .page-accounts .accounts-distribution-filter select {
        appearance: none;
        border-radius: 999px;
        border: 1px solid var(--color-border-subtle);
        background: rgba(15, 18, 23, 0.8);
        color: var(--color-text);
        font-size: 0.7rem;
        padding: 6px 28px 6px 12px;
        outline: none;
        cursor: pointer;
      }

      .page-accounts .accounts-distribution-filter .select-arrow {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
        font-size: 0.55rem;
        color: var(--color-text-tertiary);
      }

      .page-accounts .accounts-distribution-filter .select-wrap {
        position: relative;
      }

      .page-accounts .accounts-distribution-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr);
        gap: 16px;
        align-items: stretch;
        flex: 1;
        min-height: 0;
      }

      .page-accounts .accounts-donut {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 240px;
        min-width: 0;
        max-width: 100%;
        max-height: 100%;
      }

      .page-accounts .accounts-donut .chart-placeholder {
        width: 232px;
        height: 232px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: radial-gradient(circle at center, rgba(10, 12, 16, 0.92), rgba(18, 20, 24, 0.6));
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.45), 0 18px 36px rgba(0, 0, 0, 0.35);
        max-width: 100%;
        max-height: 100%;
      }

      .page-accounts .accounts-donut .accounts-donut-segment {
        opacity: 0.85;
        transition: opacity 0.2s ease, filter 0.2s ease;
      }

      .page-accounts .accounts-donut .accounts-donut-segment.is-active {
        opacity: 1;
        filter: drop-shadow(0 0 8px currentColor);
      }

      .page-accounts .accounts-donut .accounts-donut-segment.is-dimmed {
        opacity: 0.25;
        filter: none;
      }

      .page-accounts .accounts-distribution-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-align: center;
        color: var(--color-text-tertiary);
        font-size: 0.72rem;
      }

      .page-accounts .accounts-legend {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .page-accounts .accounts-distribution-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
        overflow: hidden;
      }

      .page-accounts .accounts-legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        border-radius: 12px;
        font-size: 0.76rem;
        color: var(--color-text-secondary);
        background: transparent;
        transition: color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      }

      .page-accounts .accounts-legend-item.is-active {
        color: var(--color-text-primary);
        background: rgba(255, 255, 255, 0.04);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      }

      .page-accounts .accounts-legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--legend-color);
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
      }

      .page-accounts .accounts-distribution-item {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 4px 8px;
        border-radius: 12px;
        background: rgba(15, 18, 23, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.04);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .page-accounts .accounts-distribution-item.is-active {
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .page-accounts .accounts-distribution-item--compact {
        gap: 6px;
      }

      .page-accounts .accounts-distribution-item-line {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.74rem;
        color: var(--color-text);
      }

      .page-accounts .accounts-distribution-item-label {
        font-weight: 600;
        flex: 1;
      }

      .page-accounts .accounts-distribution-item-percent {
        font-size: 0.68rem;
        color: var(--color-text-secondary);
      }

      .page-accounts .accounts-distribution-item-value {
        font-weight: 600;
        font-size: 0.7rem;
      }

      .page-accounts .accounts-distribution-item-details {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }

      .page-accounts .accounts-distribution-item-provider {
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--color-text);
      }

      .page-accounts .accounts-distribution-item-stats {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 0.66rem;
        color: var(--color-text-secondary);
      }

      .page-accounts .accounts-distribution-item-stats span:first-child {
        color: var(--color-text);
        font-weight: 600;
      }

      .page-accounts .accounts-distribution-item-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.74rem;
        color: var(--color-text);
      }

      .page-accounts .accounts-distribution-item-name {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }

      .page-accounts .accounts-distribution-item-meta {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 0.68rem;
        color: var(--color-text-secondary);
      }

      .page-accounts .accounts-distribution-item-meta span:first-child {
        color: var(--color-text);
      }

      .page-accounts .accounts-distribution-bar {
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      .page-accounts .accounts-distribution-bar span {
        display: block;
        height: 100%;
        width: var(--fill-width, 0%);
        background: var(--fill-color);
      }

      
      /* Accounts filters + table (match Trade History layout) */
      .page-accounts .accounts-filters {
        padding: 10px 16px;
      }

      .page-accounts .table-panel {
        padding: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .page-accounts .accounts-table-panel {
        flex: 1;
        min-height: 0;
      }

      .page-accounts .table-wrap {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }

      .page-accounts .accounts-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .page-accounts .accounts-table thead,
      .page-accounts .accounts-table tbody {
        display: block;
      }

      .page-accounts .accounts-table thead {
        flex: 0 0 auto;
      }

      .page-accounts .accounts-table tbody {
        flex: 1 1 auto;
        overflow-y: auto;
        scrollbar-gutter: stable;
        min-height: 0;
      }

      .page-accounts .accounts-table thead tr,
      .page-accounts .accounts-table tbody tr {
        display: table;
        width: 100%;
        table-layout: fixed;
      }

      .page-accounts .accounts-table th,
      .page-accounts .accounts-table td {
        padding: 10px 18px;
        border-bottom: 1px solid var(--color-overlay-sm);
        font-size: 0.78rem;
        color: var(--color-text-secondary);
        text-align: left;
        white-space: nowrap;
        vertical-align: middle;
      }

      /* PnL / Performance coloring */
      .page-accounts .accounts-table td.metric-positive {
        color: var(--color-status-positive);
      }

      .page-accounts .accounts-table td.metric-negative {
        color: var(--color-status-negative);
      }


      .page-accounts .accounts-table th {
        position: sticky;
        top: 0;
        background: var(--color-component-table-header-bg);
        color: var(--color-text);
        font-size: 0.62rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        z-index: 2;
      }

      .page-accounts .accounts-table td.numeric,
      .page-accounts .accounts-table th.numeric {
        text-align: right;
      }

      .page-accounts .accounts-table td:nth-child(2),
      .page-accounts .accounts-table td:nth-child(3),
      .page-accounts .accounts-table td:nth-child(4),
      .page-accounts .accounts-table td:nth-child(5),
      .page-accounts .accounts-table td:nth-child(6) {
        text-align: right;
      }

      /* Column widths (tidy header alignment) */
      .page-accounts .accounts-table th:nth-child(1),
      .page-accounts .accounts-table td:nth-child(1) { width: 22%; }
      .page-accounts .accounts-table th:nth-child(2),
      .page-accounts .accounts-table td:nth-child(2) { width: 12%; }
      .page-accounts .accounts-table th:nth-child(3),
      .page-accounts .accounts-table td:nth-child(3) { width: 7%; }
      .page-accounts .accounts-table th:nth-child(4),
      .page-accounts .accounts-table td:nth-child(4) { width: 7%; }
      .page-accounts .accounts-table th:nth-child(5),
      .page-accounts .accounts-table td:nth-child(5) { width: 7%; }
      .page-accounts .accounts-table th:nth-child(6),
      .page-accounts .accounts-table td:nth-child(6) { width: 10%; }
      .page-accounts .accounts-table th:nth-child(7),
      .page-accounts .accounts-table td:nth-child(7) { width: 31%; }
      .page-accounts .accounts-table th:nth-child(8),
      .page-accounts .accounts-table td:nth-child(8) { width: 4%; }

      .page-accounts .accounts-table tbody tr:hover td {
        background: rgba(255, 255, 255, 0.03);
      }

      .page-accounts .account-main {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }

      .page-accounts .account-id {
        font-size: 0.84rem;
        font-weight: 700;
        color: var(--color-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .page-accounts .account-type {
        font-size: 0.66rem;
        color: var(--color-text-secondary);
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }

      .page-accounts .account-type .exchange-icon {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        opacity: 0.92;
        flex-shrink: 0;
      }
      
      .page-accounts .account-type span {
        color: var(--color-text);
      }

      .page-accounts .assets-bar {
        display: flex;
        align-items: center;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.35);
      }

      .page-accounts .asset-segment {
        height: 100%;
        background: var(--asset-color);
        position: relative;
        cursor: pointer;
        transition: filter 0.2s ease;
      }

      .page-accounts .asset-segment:hover {
        filter: brightness(1.15);
      }

      .page-accounts .asset-tooltip {
        position: fixed;
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 10px 12px 10px 16px;
        border-radius: 10px;
        background: rgba(12, 14, 18, 0.96);
        color: var(--color-text);
        font-size: 0.7rem;
        white-space: nowrap;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
        pointer-events: none;
        opacity: 0;
        transform: translate3d(0, 0, 0);
        transition: opacity 0.15s ease;
      }

      .page-accounts .asset-tooltip.is-visible {
        opacity: 1;
      }

      .page-accounts .asset-tooltip-name {
        font-weight: 700;
        font-size: 0.74rem;
        letter-spacing: 0.02em;
      }

      .page-accounts .asset-tooltip-accent {
        position: absolute;
        inset: 0 auto 0 0;
        width: 3px;
        border-radius: 10px 0 0 10px;
        background: var(--asset-color);
      }

      .page-accounts .autotrader-count-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 36px;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(86, 221, 97, 0.12);
        color: var(--color-status-positive);
        font-weight: 600;
        font-size: 0.68rem;
      }

      .page-accounts .table-action {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        border: 1px solid var(--color-border-subtle);
        background: rgba(18, 21, 26, 0.7);
        color: var(--color-text-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .page-accounts .table-footer {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        padding: 10px 16px 14px;
        font-size: 0.75rem;
        color: var(--color-muted);
        border-top: 1px solid var(--color-border-subtle);
        background: var(--color-overlay-xxs);
      }

      .page-accounts .rows-select {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        justify-self: start;
      }

      .page-accounts .rows-select .rows-pill {
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-component-dropdown-border);
        background: var(--color-component-dropdown-bg);
        color: var(--color-component-dropdown-text);
        font-size: 0.75rem;
        appearance: none;
      }

      .page-accounts .pagination {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-self: center;
      }

      .page-accounts .page-button {
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: transparent;
        color: var(--color-muted);
        font-size: 0.75rem;
      }

      .page-accounts .page-button.active {
        border-color: var(--color-action-primary-border-strong);
        color: var(--color-text);
      }
@media (max-width: 1200px) {
        .page-accounts .accounts-summary-grid {
          grid-template-columns: 1fr;
        }
      }
    
/* Filters */
.page-accounts .filter-bar {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)) auto;
  gap: 10px;
  align-items: end;
}

.page-accounts .filter-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.page-accounts .filter-label {
  font-size: 0.62rem;
  color: var(--color-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.22em;
}

.page-accounts .filter-section {
  display: flex;
  align-items: center;
  border-radius: 8px;
  border: 1px solid var(--color-border-subtle);
  background: var(--color-surface-panel-strong);
  box-shadow: inset 0 1px 0 var(--color-overlay-xxs-strong), 0 10px 18px var(--color-shadow-soft);
}

.page-accounts .filter-input,
.page-accounts .filter-select {
  width: 100%;
  background: var(--color-component-dropdown-bg);
  border: 1px solid var(--color-component-dropdown-border);
  border-radius: 6px;
  color: var(--color-component-dropdown-text);
  font-size: 0.72rem;
  padding: 6px 8px;
  height: 32px;
  outline: none;
}

.page-accounts .filter-input::placeholder {
  color: var(--color-text-tertiary);
}

.page-accounts .filter-select {
  cursor: pointer;
}

.page-accounts .filter-button {
  align-self: end;
  height: 32px;
  padding: 0 14px;
  border-radius: 999px;
  white-space: nowrap;
  border-color: var(--color-action-primary-border);
  background: transparent;
  box-shadow: none;
}

/* Table panel (like Trade History) */
.page-accounts .accounts-table-panel {
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

.page-accounts .accounts-table-wrap {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  flex: 1;
}

/* Trade-history-like fixed header + scroll body */
.page-accounts .accounts-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.page-accounts .accounts-table thead,
.page-accounts .accounts-table tbody {
  display: block;
}

.page-accounts .accounts-table thead tr,
.page-accounts .accounts-table tbody tr {
  display: table;
  width: 100%;
  table-layout: fixed;
}

.page-accounts .accounts-table tbody {
  overflow-y: auto;
  flex: 1 1 auto;
  scrollbar-gutter: stable;
}

.page-accounts .accounts-table th,
.page-accounts .accounts-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--color-overlay-sm);
  font-size: 0.78rem;
  color: var(--color-text-secondary);
  text-align: left;
  white-space: nowrap;
}

.page-accounts .accounts-table th {
  padding: 10px 18px;
  background: var(--color-component-table-header-bg);
  color: var(--color-text);
  font-size: 0.62rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  text-align: center;
}
      
.page-accounts .accounts-table tbody tr:hover {
  background: rgba(255, 255, 255, 0.02);
}

.page-accounts .accounts-table td:first-child {
  white-space: normal;
}

/* Value column emphasis */
.page-accounts .accounts-table td:nth-child(2) {
  font-size: 0.86rem;
  font-weight: 650;
  color: var(--color-text);
}
      
/* Column alignment */
.page-accounts .accounts-table th:nth-child(2),
.page-accounts .accounts-table td:nth-child(2),
.page-accounts .accounts-table th:nth-child(3),
.page-accounts .accounts-table td:nth-child(3),
.page-accounts .accounts-table th:nth-child(4),
.page-accounts .accounts-table td:nth-child(4),
.page-accounts .accounts-table th:nth-child(5),
.page-accounts .accounts-table td:nth-child(5) {
  text-align: right;
}

.page-accounts .accounts-table th:nth-child(6),
.page-accounts .accounts-table td:nth-child(6),
.page-accounts .accounts-table th:nth-child(8),
.page-accounts .accounts-table td:nth-child(8) {
  text-align: center;
}


    </style>
  </head>
  <body class="page-accounts">
    <div id="app" class="app">
      <header class="header section section--header section-header accounts-header">
        <div class="section-header">
          <div class="accounts-header-spacer"></div>
          <h1 class="section-title">Accounts</h1>
          <div class="accounts-header-spacer"></div>
        </div>
      </header>
      <div class="app-body">
        <aside data-sidebar-slot></aside>
        <main class="main accounts-main">
          <div class="accounts-content">
            <section class="section section--primary accounts-summary">
              <div class="accounts-summary-grid">
                <div class="accounts-summary-left accounts-panel">
                  <div class="accounts-section-title">EQUITY SUMMARY</div>
                  <div class="accounts-summary-panel">
                    <div class="asset-summary">
                      <div class="asset-summary-header">
                        <div class="asset-summary-metric">
                          <h1>
                            <span data-field="asset.totalBalance">--</span>
                            <span class="badge positive" data-field="asset.change">--</span>
                          </h1>
                        </div>
                        <div class="asset-summary-pills">
                          <button data-range="7D">7D</button>
                          <button data-range="30D">30D</button>
                          <button data-range="90D">90D</button>
                          <button data-range="ALL" class="active">ALL</button>
                        </div>
                      </div>
                      <div class="total-performance-chart" data-total-performance="accounts" data-field="asset.chart"></div>
                    </div>
                  </div>
                </div>
                <div class="accounts-distribution accounts-panel">
                  <div class="accounts-distribution-header">
                    <div class="accounts-distribution-title">Accounts Distribution</div>
                    <label class="accounts-distribution-filter">
                      <span>Filter</span>
                      <span class="select-wrap">
                        <select data-accounts-filter>
                          <option value="accounts">Accounts</option>
                          <option value="market">Market Type</option>
                          <option value="assets">Assets</option>
                        </select>
                        <span class="select-arrow">▾</span>
                      </span>
                    </label>
                  </div>
                  <div class="accounts-distribution-layout">
                    <div class="accounts-donut" data-accounts-donut>
                      <div class="chart-placeholder"></div>
                    </div>
                    <div class="accounts-distribution-list">
                      <div class="accounts-legend" data-accounts-legend></div>
                    </div>
                  </div>
                </div>
              </div>
            </section>
                        
            <section class="section trade-history-filters accounts-filters">
              <div class="filter-bar accounts-filterbar" aria-label="Accounts filters">
                <div class="filter-field">
                  <span class="filter-label">Search</span>
                  <div class="filter-section">
                    <input
                      class="filter-input"
                      type="search"
                      placeholder="Search account name"
                      data-accounts-search
                    />
                  </div>
                </div>

                <div class="filter-field">
                  <span class="filter-label">Market</span>
                  <div class="filter-section">
                    <select class="filter-select" data-accounts-market-filter>
                      <option value="all" selected>All</option>
                    </select>
                  </div>
                </div>

                <div class="filter-field">
                  <span class="filter-label">Provider</span>
                  <div class="filter-section">
                    <select class="filter-select" data-accounts-provider-filter>
                      <option value="all" selected>All</option>
                    </select>
                  </div>
                </div>

                <div class="filter-field">
                  <span class="filter-label">Autotrader</span>
                  <div class="filter-section">
                    <select class="filter-select" data-accounts-autotrader-filter>
                      <option value="all" selected>All</option>
                      <option value="active">Active</option>
                      <option value="inactive">Not active</option>
                    </select>
                  </div>
                </div>

                <button class="button filter-button" type="button" data-accounts-clear>
                  Clear
                </button>
              </div>
            </section>

            <section class="section table-panel accounts-table-panel">
              <div class="table-wrap">
                <table class="accounts-table">
                  <thead>
                    <tr>
                      <th>Account</th>
                      <th class="numeric">Value</th>
                      <th class="numeric">7D</th>
                      <th class="numeric">30D</th>
                      <th class="numeric">90D</th>
                      <th class="numeric">Autotraders</th>
                      <th>Assets</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody data-accounts-rows></tbody>
                </table>
              </div>

              <div class="table-footer">
                <div class="rows-select">
                  <span>Rows per page</span>
                  <select class="rows-pill" data-accounts-rows-per-page>
                    <option value="10" selected>10</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                  </select>
                </div>
                <div class="pagination" data-accounts-pagination></div>
                <div></div>
              </div>
            </section>

          </div>
        </main>
      </div>
    </div>
    <script type="module" src="../src/scripts/main.js"></script>
    <script type="module" src="../src/scripts/pages/accountsPage.js"></script>
  </body>
</html>
