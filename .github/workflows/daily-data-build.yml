name: Daily Data Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build daily equity
        run: node scripts/buildEquityDaily.mjs

      - name: Build latest meta
        run: node scripts/buildLatestMeta.mjs

      - name: Commit data changes
        run: |
          git config user.name "byscript-bot"
          git config user.email "bot@byscript.io"
          git add data
          git commit -m "chore(data): daily derived update" || echo "No changes"
          git push
